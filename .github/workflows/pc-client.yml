name: Windows PC build

on:
  push:
    branches: [main]
    paths:
      - windows/**
      - .github/workflows/pc-client.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  byedpi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            windows/vendor/byedpi
      - name: Install the pinned ByeDPI toolchains
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            python3 make=4.3-4.1 gcc=4:12.2.0-3 gcc-12=12.2.0-14+deb12u1 \
            libc6-dev linux-libc-dev=6.1.190-1 \
            binutils=2.40-2 binutils-x86-64-linux-gnu=2.40-2 \
            gcc-mingw-w64-x86-64-win32=12.2.0-14+deb12u1+25.2+b1 \
            gcc-mingw-w64-x86-64-win32-runtime=12.2.0-14+deb12u1+25.2+b1 \
            gcc-mingw-w64-base=12.2.0-14+deb12u1+25.2+b1 \
            binutils-mingw-w64-x86-64=2.40-2+10.4 \
            mingw-w64-common=10.0.0-3 mingw-w64-x86-64-dev=10.0.0-3 \
            musl=1.2.3-1 musl-dev=1.2.3-1 musl-tools=1.2.3-1
      - name: Reproduce and verify both pinned ByeDPI binaries
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1784160000'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path, PurePosixPath
          import shutil
          import subprocess
          import tempfile
          import zipfile

          root = Path('windows')
          delivery = root / 'vendor/byedpi'
          def properties(path):
              return dict(line.split('=', 1) for line in path.read_text().splitlines() if '=' in line)
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          source = properties(delivery / 'byedpi.source.properties')
          archive = delivery / 'byedpi.SOURCE.zip'
          assert source['version'] == '0.17.3'
          assert digest(archive) == source['source'], 'ByeDPI source checksum mismatch'
          for platform, profile, filename, arguments in (
              ('windows', 'windows-disorder-fake', 'ciadpi.exe',
               ['windows', 'CC=x86_64-w64-mingw32-gcc-win32', 'LDFLAGS=-static -Wl,--no-insert-timestamp']),
              ('linux', 'linux-md5sig', 'ciadpi',
               ['CC=musl-gcc', 'CPPFLAGS=-D_DEFAULT_SOURCE -D_GNU_SOURCE -idirafter /usr/include -idirafter /usr/include/x86_64-linux-gnu', 'LDFLAGS=-static']),
          ):
              manifest = properties(delivery / f'byedpi-{platform}.properties')
              assert manifest['version'] == source['version'] and manifest['source'] == source['source']
              assert manifest['profile'] == profile
              with tempfile.TemporaryDirectory(prefix=f'byedpi-{platform}-') as scratch:
                  build = Path(scratch)
                  with zipfile.ZipFile(archive) as packed:
                      for item in packed.infolist():
                          path = PurePosixPath(item.filename)
                          assert not path.is_absolute() and '..' not in path.parts
                          assert '\\' not in item.filename and ':' not in item.filename
                          assert (item.external_attr >> 16) & 0o170000 != 0o120000
                      packed.extractall(build)
                  subprocess.run(['make', '-j2', *arguments], cwd=build, check=True)
                  binary = build / filename
                  assert digest(binary) == manifest['ciadpi'], f'{platform} ByeDPI binary checksum mismatch'
                  target = root / f'build/runtime/{platform}-x64'
                  target.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(binary, target / filename)
                  print(f'{platform} ByeDPI {source["version"]}: verified {manifest["ciadpi"]}')
          PY
      - name: Verified Windows ByeDPI runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ByeDPI-Windows-${{ github.sha }}
          path: windows/build/runtime/windows-x64/ciadpi.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  windows:
    needs: byedpi
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            windows
      - name: Download the verified ByeDPI runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ByeDPI-Windows-${{ github.sha }}
          path: windows/build/runtime/windows-x64
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify native core and build Windows release
        shell: pwsh
        env:
          NOKI_NATIVE_WMI_POLICY_TESTS: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 build tools are required' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & .\windows\scripts\prepare-runtime.ps1 -VerifyTests
          & .\windows\scripts\build.ps1 -JavaHome $env:JAVA_HOME -ReleaseDirectory (Join-Path $env:GITHUB_WORKSPACE 'releases\windows')
      - name: Release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Noki-Windows-${{ github.sha }}
          path: releases/windows/Noki-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Test and preflight reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-checks-${{ github.sha }}
          path: |
            windows/build/reports/tests/
            windows/build/test-results/
            windows/build/package-preflight/
            windows/build/nucleus-tao/reports/tests/
          if-no-files-found: warn
          retention-days: 7
